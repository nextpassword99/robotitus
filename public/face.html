<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <title>Rostro Robot - SENATI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0a0a0a;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #faceContainer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #particlesCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.2;
      pointer-events: none;
    }

    #faceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Indicador de conexión discreto */
    #connectionStatus {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
      z-index: 10;
    }

    #connectionStatus.disconnected {
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    /* Botón de pantalla completa */
    #fullscreenBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.3);
      border: 2px solid rgba(16, 185, 129, 0.6);
      color: #10b981;
      font-size: 24px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    #fullscreenBtn:hover {
      background: rgba(16, 185, 129, 0.5);
      transform: scale(1.1);
    }

    #fullscreenBtn:active {
      transform: scale(0.95);
    }

    /* Ocultar en pantalla completa */
    :fullscreen #fullscreenBtn,
    :-webkit-full-screen #fullscreenBtn,
    :-moz-full-screen #fullscreenBtn,
    :-ms-fullscreen #fullscreenBtn {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Indicador de conexión -->
  <div id="connectionStatus"></div>

  <!-- Botón de pantalla completa -->
  <button id="fullscreenBtn" title="Pantalla completa">⛶</button>

  <!-- Contenedor del Rostro -->
  <div id="faceContainer">
    <!-- Partículas de fondo -->
    <canvas id="particlesCanvas"></canvas>
    
    <!-- Canvas Principal -->
    <canvas id="faceCanvas"></canvas>
  </div>

  <script>
    // Función para entrar en pantalla completa
    function enterFullscreen() {
      const elem = document.documentElement;
      
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) { // Safari
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) { // IE11
        elem.msRequestFullscreen();
      }
    }

    // Detectar orientación y entrar automáticamente en pantalla completa
    function handleOrientationChange() {
      if (window.matchMedia("(orientation: landscape)").matches) {
        // Estamos en horizontal, intentar pantalla completa
        if (!document.fullscreenElement && 
            !document.webkitFullscreenElement && 
            !document.msFullscreenElement) {
          enterFullscreen();
        }
      }
    }

    // Botón manual de pantalla completa
    document.getElementById('fullscreenBtn').addEventListener('click', enterFullscreen);

    // Detectar cambio de orientación
    window.addEventListener('orientationchange', handleOrientationChange);
    screen.orientation?.addEventListener('change', handleOrientationChange);

    // Verificar orientación al cargar
    if (window.matchMedia("(orientation: landscape)").matches) {
      // Pequeño delay para asegurar que la página esté lista
      setTimeout(enterFullscreen, 500);
    }

    // Bloquear scroll en móvil
    document.body.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });
  </script>

  <script src="/face.js"></script>
</body>
</html>
